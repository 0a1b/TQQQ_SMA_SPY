name: Daily Strategy Update
on:
  schedule:
    - cron: '0 0 * * *' # Runs at midnight UTC
  workflow_dispatch:    # Allows manual click-to-run

# Permissions needed for the bot to deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment (prevents clashes)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # JOB 1: Run Python and Build the Site
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Strategy Script
        run: python main.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # JOB 2: Deploy the Site (Only runs if Build succeeds)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # JOB 3: Keep the scheduled workflow alive (prevents GitHub auto-disabling it after 60 days idle)
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'   # only bother on the cron run, not manual dispatch
    permissions:
      contents: write   # overrides the top-level 'read' just for this job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Keep workflow alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
